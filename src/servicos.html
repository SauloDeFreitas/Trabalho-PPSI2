    <head>

        <link rel="stylesheet" href="../styles/template.css">
    </head>
    <body>
        <nav id="barraNavegacao">
            <img alt="logotipo da empresa" src="../imgs/logo.webp">
            <label id="labelNav" for="botaoBarraNav">Botão para uso de navegacao de dispositivos mobile</label>
            <input id="botaoBarraNav" role="button" type="checkbox">
            <ul>
                <li><a href="index.html"><button>Home</button></a></li>

        <main id="mainServicos">
            <img  alt="Imagem de uma mulher consertando dispositivo eletronico" id="imagemServicos" src="../imgs/Servicos_Prestados/Assistencia Tecnica.webp">
            <form id="formularioServicos">
                <h1>Defina o Serviço</h1>
                <label for="nomeCliente">Seu Nome</label>
                <input id="nomeCliente">

                <fieldset id="selecaoServico">
                    <legend>Tipo Do Aparelho</legend>
                    <label>
                        <span>Celular</span>
                        <input id="celular" name="escolha" type="radio">
                    </label>

                    <label>
                        <span>Notebook</span>
                        <input id="notebook" name="escolha" type="radio">
                    </label>

                    <label>
                        <span>Computador</span>
                        <input id="computador" name="escolha" type="radio">
                    </label>
                </fieldset>

                <label for="tipoServico">Tipo Do Serviço</label>
                <input id="tipoServico">
                <button type="submit">Enviar</button>
            </form>
        </main>
        <footer>
            <p>NexTec - 2026</p>
            <p>Rua dos Girassóis Azuis, nº 142</p>
